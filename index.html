<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CODE : 죽림고수</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >
</head>

<body>

    <main id="game">

        <canvas id="gameCanvas"></canvas>

        <div id="hud">

            <div class="logo">
                CODE
            </div>

            <div class="life">
                ♥
            </div>

            <div class="time">
                00.00
            </div>

        </div>

        <section
            id="startScreen"
            class="screen"
        >

            <div class="small-title">
                BAMBOO SURVIVAL
            </div>

            <h1>
                CODE
            </h1>

            <h2>
                죽림고수
            </h2>

            <p>
                쏟아지는 화살을 피해<br>
                최대한 오래 살아남아라.
            </p>

            <div class="control">
                WASD / 방향키
            </div>

            <button id="startButton">
                GAME START
            </button>

        </section>

        <section
            id="gameOverScreen"
            class="screen hidden"
        >

            <div class="small-title">
                SURVIVAL ENDED
            </div>

            <h2>
                GAME OVER
            </h2>

            <div id="finalTime">
                00.00
            </div>

            <button id="restartButton">
                RESTART
            </button>

            <div>
                R 키로 재시작
            </div>

        </section>

    </main>

    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>
